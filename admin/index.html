<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin Login</title>
<style>
:root{--bg:#000;--card:#111317;--line:#23262d;--tx:#e8e8ea;--mu:#8b8e97;--red:#ef4444;--blue:#3b82f6}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.6 system-ui,Segoe UI,sans-serif;min-height:100vh}
.wrap{max-width:1100px;margin:auto;padding:24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px;margin-bottom:20px}
h2{font-size:20px;margin-bottom:16px}h3{font-size:15px;margin:18px 0 10px}
label{display:block;font-size:12px;color:var(--mu);margin:10px 0 4px}
input[type=text],input[type=password],textarea{width:100%;background:#0b0c0e;border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:10px 12px;font:14px/1.5 inherit}
textarea{min-height:70px;resize:vertical}
input:focus,textarea:focus{outline:none;border-color:var(--blue)}
.btn{display:inline-block;background:var(--blue);border:0;color:#fff;border-radius:8px;padding:10px 18px;font-weight:700;cursor:pointer;font-size:14px}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--tx)}
.btn.danger{background:none;border:1px solid var(--red);color:var(--red)}
.btn.sm{padding:6px 12px;font-size:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.item{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px;background:#0d0e11}
.itemhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.loginbox{max-width:380px;margin:12vh auto;padding:32px}
.err{color:var(--red);font-size:13px;min-height:20px;margin-top:8px}
#panel{display:none}
.topbar{position:sticky;top:0;z-index:10;background:#000000ee;backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
iframe#pv{width:100%;height:82vh;border:1px solid var(--line);border-radius:12px;background:#000}
.note{font-size:12px;color:var(--mu);margin-top:10px}
.back{display:block;text-align:center;margin-top:14px;font-size:13px;color:var(--mu)}
@media(max-width:900px){.cols{grid-template-columns:1fr}}
</style>
</head>
<body>

<div id="loginWrap" class="wrap">
  <div class="card loginbox">
    <h2>🔒 Admin Login</h2>
    <label>Username</label>
    <input type="text" id="u" autocomplete="username">
    <label>Password</label>
    <input type="password" id="p" autocomplete="current-password">
    <div style="margin-top:16px"><button class="btn" id="go" style="width:100%">Login</button></div>
    <div class="err" id="err"></div>
    <a class="back" href="../index.html">← Back to site</a>
  </div>
</div>

<div id="panel">
  <div class="topbar">
    <b>✏️ Portfolio Editor</b>
    <div class="row">
      <button class="btn sm" id="dl">💾 Save</button>
      <label class="btn sm ghost" style="cursor:pointer">📂 Load file<input type="file" id="ld" accept=".json,application/json" hidden></label>
      <button class="btn sm ghost" id="out">Logout</button>
    </div>
  </div>
  <div class="wrap">
    <div class="note">Edit sa kaliwa — live preview sa kanan. Pag tapos, pindutin ang <b>💾 Save</b> para i-download ang bagong content.json, palitan yung file sa Netlify deploy mo, tapos re-upload.</div>
    <div class="note" id="cfgNote" style="color:var(--blue)"></div>
    <div class="cols" style="margin-top:14px">
      <div id="editor"></div>
      <div><iframe id="pv" src="../index.html" title="Preview"></iframe></div>
    </div>
  </div>
</div>

<script>
// ==================== PALITAN MO ITO ====================
// Simple login lang ito (nasa JavaScript, nakikita sa view-source).
// Pang-personal na gamit lang — HUWAG i-share publicly yung /admin/ link.
const ADMIN_USER = "admin";
const ADMIN_PASS = "admin123";
// ========================================================
// Built-in fallback content (ginagamit kapag hindi ma-fetch ang content.json,
// hal. binuksan ang admin nang diretso bilang file). I-download mo ang
// content.json pagkatapos mag-edit para laging updated ito.
const DEFAULT_CONFIG={"about": {"hobbies": ["Coding", "Playing Games", "Sing"], "text": "I'm Steven Joe T. Reyes, a first-year DCT student from Ilocos Sur. I learn by shipping real projects — panels, dashboards, and systems people actually use. My path: BSIT → Master's Degree → Work.", "title": "Who I Am?"}, "education": [{"degree": "Diploma in Computer Technology", "school": "University of Northern Philippines", "years": "2026 - Present · 1st Year"}, {"degree": "High School | Humanities and Social Sciences", "school": "Cabugao Institute", "years": "2019 - 2026"}, {"degree": "Elementary", "school": "Aragan Elementary School", "years": ""}], "experience": [{"place": "Smmsocialpulse (smmsocialpulse.shop)", "role": "Owner & Developer", "years": "2025 - Present"}, {"place": "SkwelaGo", "role": "Owner & Developer", "years": "2026 - Present"}, {"place": "PicSmooth Studio", "role": "Owner & Developer", "years": "2026 - Present"}, {"place": "Barangay Management System", "role": "Project Build", "years": "2026 - Present"}, {"place": "Student Attendance Monitor", "role": "Project Build", "years": "2026 - Present"}, {"place": "Smmsocialpulse Hosting", "role": "Project Build", "years": "2025 - 2026"}], "footer": {"tagline": "Building practical web systems — from panels to platforms."}, "projects": [{"code": "", "demo": "https://smmsocialpulse.shop", "description": "Social media services platform with ordering, notifications, service analytics, admin tools, and a responsive interface.", "image": "project-smmsocialpulse.jpg", "tech": ["PHP", "MySQL", "JavaScript"], "title": "Smmsocialpulse - 2025"}, {"code": "", "demo": "https://skwelago-4f5a0.web.app", "description": "Northern Philippines commute and student app: jeepney/bus trip planner with fare calculator (LTFRB rates), 9,861-barangay search, live GPS navigation, class schedules, tasks, allowance tracker, reviewers and marketplace. Built as a Firebase PWA, targeting Google Play in December 2026.", "image": "project-skwelago.jpg", "tech": ["JavaScript", "Firebase", "Google Maps API", "PWA"], "title": "SkwelaGo - 2026"}, {"code": "", "demo": "", "description": "AI photo enhancer website: upload a normal photo and enhance it to HD / HD+ / 4K / Ultra HD with a before-after slider. Wink Studio-style dark dashboard with an on-device enhance fallback and an optional Replicate Real-ESRGAN cloud backend.", "image": "project-picsmooth.jpg", "tech": ["JavaScript", "Replicate API", "Vercel"], "title": "PicSmooth Studio - 2026"}, {"code": "", "demo": "https://barangay-management-system-app.netlify.app", "description": "Complete barangay management system: login with OTP, dashboard, resident records, officials, blotter, calendar, printable certificates, business permits, budgeting with purpose tracking, assembly records, and reports. Built in two versions — PHP 8 + MySQL for hosting, and a static Netlify version. Live demo login: admin@barangay.local / password123", "image": "project-barangay.jpg", "tech": ["PHP", "MySQL", "JavaScript", "Netlify"], "title": "Barangay Management System - 2026"}, {"code": "", "demo": "", "description": "Classroom attendance dashboard for tracking student presence, rosters, and day-to-day classroom monitoring.", "image": "project-attendance.jpg", "tech": ["HTML", "CSS", "JavaScript"], "title": "Student Attendance Monitor - 2026"}, {"code": "", "demo": "", "description": "Web hosting company website with real multi-page navigation: home, pricing, features, about and contact, domain search, hosting plans and a client-area style flow — every button does a real action, no dead links.", "image": "project-stevenhost.jpg", "tech": ["HTML", "CSS", "JavaScript"], "title": "StevenHost - 2026"}, {"code": "", "demo": "", "description": "Minecraft Bedrock add-on: altar pieces, statues with marble and gold pedestals, and detailed sanctuary elements.", "image": "project-altar.jpg", "tech": ["Minecraft Bedrock", "JSON"], "title": "Catholic Altar Set - 2026"}], "site": {"avatar": "avatar.jpg", "email": "stevenjoereyes0625@gmail.com", "github": "stevenjoereyes", "hello": "HELLO WORLD!", "intro": "I am Steven Reyes, a first-year IT student turning practical problems into focused web systems, admin tools, and creative digital projects.", "linkedin": "", "name": "Steven Reyes", "typing": "Building systems that work in the real world."}, "techstack": [{"group": "Front End", "items": ["HTML5", "CSS3", "JavaScript", "TypeScript", "React"]}, {"group": "Back End", "items": ["PHP", "MySQL", "Node.js", "Python", "Java", "Kotlin", "Ruby"]}, {"group": "APIs & Integrations", "items": ["Meta/Facebook API", "Telegram Bot API", "Gmail API", "MariBank API", "Gcash API", "Google Pay API", "Paymongo API", "Github API", "Paymaya API", "Binance API"]}, {"group": "Hosting & Platforms", "items": ["DirectAdmin", "cPanel/WHM", "Netlify", "GitHub", "Hostinger", "Firebase Hosting"]}, {"group": "Tools", "items": ["VS Code", "Git", "Linux Administration", "Ubuntu", "Linux Mint", "Debian", "Kali Linux", "Tails", "Termux"]}]};

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

if(sessionStorage.getItem("pa")==="1") showPanel();

$("#go").onclick=tryLogin;
$("#p").addEventListener("keydown",e=>{if(e.key==="Enter")tryLogin()});
function tryLogin(){
  if($("#u").value===ADMIN_USER && $("#p").value===ADMIN_PASS){
    sessionStorage.setItem("pa","1");showPanel();
  }else{$("#err").textContent="Maling username o password.";}
}
$("#out").onclick=()=>{sessionStorage.removeItem("pa");location.reload()};

let cfg=null,pvTimer=null;

function setNote(t){const n=$("#cfgNote");if(n)n.textContent=t;}
function showPanel(){
  $("#loginWrap").style.display="none";
  $("#panel").style.display="block";
  const ready=()=>{buildEditor();pushPreview();$("#pv").addEventListener("load",pushPreview)};
  fetch("../content.json").then(r=>{if(!r.ok)throw 0;return r.json()}).then(c=>{
    cfg=c;setNote("Loaded ang content.json mula sa site.");ready();
  }).catch(()=>{
    cfg=JSON.parse(JSON.stringify(DEFAULT_CONFIG));
    setNote("Offline mode: built-in default ang gamit. Pwede ka pa ring mag-edit at mag-download.");
    ready();
  });
  $("#ld").addEventListener("change",e=>{
    const f=e.target.files[0];if(!f)return;
    const rd=new FileReader();
    rd.onload=()=>{try{cfg=JSON.parse(rd.result);setNote("Loaded mula sa file: "+f.name);buildEditor();pushPreview()}catch(_){setNote("Hindi mabasa yung file — siguraduhing content.json ito.")}};
    rd.readAsText(f);e.target.value="";
  });
}

function pushPreview(){
  clearTimeout(pvTimer);
  pvTimer=setTimeout(()=>{
    const f=$("#pv");
    if(f&&f.contentWindow&&cfg)try{f.contentWindow.postMessage({t:"pfolio-preview",c:cfg},"*")}catch(_){}
  },400);
}

function sec(title){
  const d=document.createElement("div");d.className="card";
  const h=document.createElement("h2");h.textContent=title;d.appendChild(h);
  return d;
}
function textInput(label,val,set){
  const w=document.createElement("div");
  const l=document.createElement("label");l.textContent=label;w.appendChild(l);
  const i=document.createElement("input");i.type="text";i.value=val??"";
  i.oninput=()=>{set(i.value);pushPreview()};
  w.appendChild(i);return w;
}
function areaInput(label,val,set){
  const w=document.createElement("div");
  const l=document.createElement("label");l.textContent=label;w.appendChild(l);
  const t=document.createElement("textarea");t.value=val??"";
  t.oninput=()=>{set(t.value);pushPreview()};
  w.appendChild(t);return w;
}
function imageField(label,val,set){
  const w=document.createElement("div");
  const l=document.createElement("label");l.textContent=label;w.appendChild(l);
  const row=document.createElement("div");row.className="row";
  const i=document.createElement("input");i.type="text";i.value=val??"";i.style.flex="1";i.placeholder="Image URL o mag-upload ng photo";
  const th=document.createElement("img");
  th.style.cssText="max-width:120px;max-height:80px;border-radius:8px;margin-top:8px;"+(val?"":"display:none");
  if(val)th.src=val;
  const sync=v=>{set(v);th.style.display=v?"block":"none";if(v)th.src=v;pushPreview()};
  i.oninput=()=>sync(i.value);
  const b=document.createElement("label");b.className="btn sm ghost";b.style.cursor="pointer";b.textContent="📷 Upload";
  const f=document.createElement("input");f.type="file";f.accept="image/*";f.hidden=true;
  f.onchange=()=>{
    const file=f.files[0];if(!file)return;
    if(file.size>8*1024*1024){setNote("Masyadong malaki yung photo (max 8MB).");f.value="";return}
    const rd=new FileReader();
    rd.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const MAX=900,sc=Math.min(1,MAX/Math.max(img.width,img.height));
        const cw=document.createElement("canvas");
        cw.width=Math.round(img.width*sc);cw.height=Math.round(img.height*sc);
        cw.getContext("2d").drawImage(img,0,0,cw.width,cw.height);
        const png=file.type==="image/png";
        const url=cw.toDataURL(png?"image/png":"image/jpeg",0.85);
        i.value=url;sync(url);
        setNote("Photo naka-embed ("+Math.round(url.length/1024)+"KB). Pindutin ang 💾 Save.");
      };
      img.onerror=()=>setNote("Hindi mabasa yung image file.");
      img.src=rd.result;
    };
    rd.readAsDataURL(file);f.value="";
  };
  b.appendChild(f);
  row.appendChild(i);row.appendChild(b);
  w.appendChild(row);w.appendChild(th);
  return w;
}
function listSec(title,arr,renderItem,blank){
  const box=sec(title);
  const body=document.createElement("div");box.appendChild(body);
  function draw(){
    body.innerHTML="";
    arr.forEach((it,idx)=>{
      const w=document.createElement("div");w.className="item";
      const head=document.createElement("div");head.className="itemhead";
      const b=document.createElement("b");b.textContent="#"+(idx+1);head.appendChild(b);
      const del=document.createElement("button");del.className="btn sm danger";del.textContent="Remove";
      del.onclick=()=>{arr.splice(idx,1);draw();pushPreview()};
      head.appendChild(del);w.appendChild(head);
      w.appendChild(renderItem(it));
      body.appendChild(w);
    });
    const add=document.createElement("button");add.className="btn sm ghost";add.textContent="+ Add";
    add.style.marginTop="4px";
    add.onclick=()=>{arr.push(JSON.parse(JSON.stringify(blank)));draw();pushPreview()};
    body.appendChild(add);
  }
  draw();return box;
}

function buildEditor(){
  const E=$("#editor");E.innerHTML="";
  const s=cfg.site;

  const site=sec("Site Info");
  site.appendChild(textInput("Name",s.name,v=>s.name=v));
  site.appendChild(textInput("Hero Title",s.hello,v=>s.hello=v));
  site.appendChild(areaInput("Intro",s.intro,v=>s.intro=v));
  site.appendChild(textInput("Typing Text",s.typing,v=>s.typing=v));
  site.appendChild(textInput("Email",s.email,v=>s.email=v));
  site.appendChild(textInput("LinkedIn path (hal. in/username)",s.linkedin,v=>s.linkedin=v));
  site.appendChild(textInput("GitHub username",s.github,v=>s.github=v));
  site.appendChild(imageField("Avatar photo",s.avatar,v=>s.avatar=v));
  E.appendChild(site);

  E.appendChild(listSec("Education",cfg.education,e=>{
    const d=document.createElement("div");
    d.appendChild(textInput("School",e.school,v=>e.school=v));
    d.appendChild(textInput("Degree",e.degree,v=>e.degree=v));
    d.appendChild(textInput("Years",e.years,v=>e.years=v));
    return d;
  },{school:"",degree:"",years:""}));

  E.appendChild(listSec("Experience",cfg.experience,e=>{
    const d=document.createElement("div");
    d.appendChild(textInput("Role",e.role,v=>e.role=v));
    d.appendChild(textInput("Place",e.place,v=>e.place=v));
    d.appendChild(textInput("Years",e.years,v=>e.years=v));
    return d;
  },{role:"",place:"",years:""}));

  E.appendChild(listSec("Tech Stack",cfg.techstack,g=>{
    const d=document.createElement("div");
    d.appendChild(textInput("Group name",g.group,v=>g.group=v));
    d.appendChild(areaInput("Items (comma-separated)",(g.items||[]).join(", "),v=>{g.items=v.split(",").map(x=>x.trim()).filter(Boolean)}));
    return d;
  },{group:"New Group",items:[]}));

  E.appendChild(listSec("Projects",cfg.projects,p=>{
    const d=document.createElement("div");
    d.appendChild(textInput("Title",p.title,v=>p.title=v));
    d.appendChild(imageField("Project image",p.image,v=>p.image=v));
    d.appendChild(areaInput("Description",p.description,v=>p.description=v));
    d.appendChild(areaInput("Technologies (comma-separated)",(p.tech||[]).join(", "),v=>{p.tech=v.split(",").map(x=>x.trim()).filter(Boolean)}));
    d.appendChild(textInput("Demo URL",p.demo,v=>p.demo=v));
    d.appendChild(textInput("Code URL",p.code,v=>p.code=v));
    return d;
  },{title:"New Project",image:"",description:"",tech:[],demo:"#",code:"#"}));

  const about=sec("About");
  about.appendChild(textInput("Title",cfg.about.title,v=>cfg.about.title=v));
  about.appendChild(areaInput("Text",cfg.about.text,v=>cfg.about.text=v));
  about.appendChild(areaInput("Hobbies (comma-separated)",(cfg.about.hobbies||[]).join(", "),v=>{cfg.about.hobbies=v.split(",").map(x=>x.trim()).filter(Boolean)}));
  E.appendChild(about);

  const foot=sec("Footer");
  foot.appendChild(textInput("Tagline",cfg.footer.tagline,v=>cfg.footer.tagline=v));
  E.appendChild(foot);
}

$("#dl").onclick=()=>{
  if(!cfg)return;
  const blob=new Blob([JSON.stringify(cfg,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download="content.json";document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
};
</script>
</body>
</html>
