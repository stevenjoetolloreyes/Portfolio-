<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portfolio</title>
<link rel="icon" href="images/icon.png" type="image/png">
<link rel="apple-touch-icon" href="images/icon.png">
<link rel="stylesheet" href="fonts/uicons.css">
<style>
:root{--bg:#faf6ec;--card:#ffffff;--line:#e5d6ae;--tx:#1c1c1c;--mu:#6e6e6e;--acc:#e6b123;--acctx:#1c1c1c;--pillbg:#ffffffb3;--linkbg:#00000008;--glow1:#ffffff66;--glow2:#ff9d0a44;--red:#ef4444;--blue:#1d4ed8;--grn:#16a34a}
[data-theme="dark"]{--bg:#101010;--card:#1b1b1b;--line:#3a352a;--tx:#f2ecdc;--mu:#a8a8a8;--acc:#e6b123;--acctx:#1c1c1c;--pillbg:#1c1c1acc;--linkbg:#ffffff0d;--glow1:#e6b12326;--glow2:#e6b12314}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth;scroll-padding-top:90px}
body{background:var(--bg);color:var(--tx);font:15px/1.6 system-ui,Segoe UI,sans-serif}
body:before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(500px 400px at 0 20%,var(--glow1),transparent),radial-gradient(600px 400px at 60% 90%,var(--glow2),transparent),radial-gradient(400px 300px at 100% 10%,var(--glow1),transparent)}
nav{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;max-width:1100px;margin:auto;padding:12px 24px;background:var(--pillbg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.logo{font-weight:800}.logo i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:3px}.logo b{color:var(--red)}
.pill{display:flex;gap:4px;background:var(--pillbg);backdrop-filter:blur(10px);border-radius:99px;padding:5px}
.navright{display:flex;gap:10px;align-items:center}
#themeBtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--pillbg);backdrop-filter:blur(10px);cursor:pointer;font-size:18px;display:grid;place-items:center;transition:transform .25s}
#themeBtn:hover{transform:rotate(25deg) scale(1.08)}
.pill a{color:var(--mu);text-decoration:none;padding:7px 16px;border-radius:99px;font-size:13px;font-weight:600}
.pill a.on{background:#fff;color:#000}
main{max-width:1000px;margin:auto;padding:0 24px}
section{padding:50px 0;border-bottom:1px solid var(--line)}
h2{font-size:22px;margin-bottom:24px;display:flex;gap:10px;align-items:center}h2 span{color:var(--blue)}h2 .fi{font-size:20px}
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:40px;align-items:center;min-height:70vh}
.hero h1{font-size:64px;font-weight:900;letter-spacing:1px}.hero p{color:var(--mu);margin:16px 0 24px}
.av{aspect-ratio:1;border-radius:12px;background:linear-gradient(135deg,#f59e0b,#ef4444);display:grid;place-items:center;font-size:80px;font-weight:900;overflow:hidden}.av img{width:100%;height:100%;object-fit:cover}
.links{display:flex;gap:12px;flex-wrap:wrap}.links a{background:var(--linkbg);border:1px solid var(--line);border-radius:8px;padding:12px 18px;color:var(--tx);text-decoration:none;min-width:120px;font-size:13px}.links a b{display:block;font-size:14px}.links a:hover{border-color:var(--acc)}
.type{margin-top:28px;color:var(--mu);font:13px monospace;border-left:2px solid var(--tx);padding-left:10px;display:inline-block}
.two{display:grid;grid-template-columns:1fr 1fr;gap:40px}
.tl{border-left:1px solid var(--line);padding-left:18px}.tl div{margin-bottom:22px}.tl b{display:block}.tl small{color:var(--mu);display:block;font-family:monospace;font-size:12px}
.grp{margin-bottom:22px}.grp h4{font-size:12px;color:var(--mu);margin-bottom:8px;letter-spacing:1px;text-transform:uppercase}
.chip{display:inline-block;background:var(--card);border:1px solid var(--line);padding:7px 14px;border-radius:7px;margin:0 8px 8px 0;font-size:13px;font-weight:600;transition:.2s}.chip:hover{transform:translateY(-3px);border-color:var(--acc)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;transition:.2s}.pc:hover{transform:translateY(-4px);border-color:var(--acc)}
.pc .im{height:150px;background:linear-gradient(135deg,#f97316,#fbbf24);background-size:cover;background-position:top}
.pc div.b{padding:16px}.pc h3{font-size:15px;margin-bottom:12px}
.btn{display:inline-block;border:1px solid #444;border-radius:6px;padding:5px 12px;font-size:12px;color:var(--tx);text-decoration:none;margin-right:6px;background:none;cursor:pointer;font-family:inherit}
.btn.g{background:#15803d;border-color:#15803d}
.more{display:block;margin:24px auto 0;background:none;border:0;color:var(--mu);cursor:pointer;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:22px;margin-bottom:20px;color:var(--mu)}.card h3{color:var(--tx);margin-bottom:10px;font-size:16px}
#modal{position:fixed;inset:0;background:#000a;backdrop-filter:blur(6px);display:none;place-items:center;z-index:50;padding:20px}#modal.show{display:grid}
.mb{background:var(--card);border:1px solid var(--line);border-radius:14px;max-width:720px;width:100%;padding:16px 20px 22px}
.dots i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;cursor:pointer}
.mg{display:grid;grid-template-columns:1fr 1.2fr;gap:20px;margin-top:14px}.mg .im{border-radius:8px;min-height:200px;background:linear-gradient(135deg,#f97316,#fbbf24) center/cover}
footer{max-width:1000px;margin:auto;padding:40px 24px;display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:30px;color:var(--mu);font-size:13px}footer a{display:block;color:var(--mu);text-decoration:none;margin:4px 0}footer h4{color:var(--tx);margin-bottom:8px}
.rv{opacity:0;transform:translateY(24px);transition:.7s}.rv.in{opacity:1;transform:none}
@media(max-width:760px){.hero,.two,.grid,.mg,footer{grid-template-columns:1fr}.hero h1{font-size:44px}nav{flex-wrap:wrap;justify-content:center;gap:8px;padding:10px 12px}nav .logo{font-size:14px}.navright{flex-wrap:wrap;justify-content:center}.pill{flex-wrap:wrap;justify-content:center;max-width:100%}.pill a{padding:7px 9px;font-size:11px}html{scroll-padding-top:130px}}

@keyframes up{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes down{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.85) rotate(-3deg)}to{opacity:1;transform:none}}
@keyframes drift{from{transform:translate(-2%,1%) scale(1)}to{transform:translate(2%,-2%) scale(1.1)}}
@keyframes out{to{opacity:0;transform:scale(.94)}}
body:before{inset:-10%;opacity:var(--glow,1);animation:drift 14s ease-in-out infinite alternate;will-change:transform,opacity}
nav{animation:down .7s both}
.pill{position:relative}.pill a{position:relative;z-index:1;transition:color .35s}.pill a.on{background:none;color:var(--acctx)}.pill a:not(.on):hover{color:var(--tx)}
#ind{position:absolute;top:5px;bottom:5px;left:0;width:0;background:var(--acc);border-radius:99px;transition:left .5s cubic-bezier(.4,0,.2,1),width .5s cubic-bezier(.4,0,.2,1)}
.hero>div:first-child>*{animation:up .9s backwards}
.hero>div:first-child>:nth-child(1){animation-delay:.1s}.hero>div:first-child>:nth-child(2){animation-delay:.3s}.hero>div:first-child>:nth-child(3){animation-delay:.5s}.hero>div:first-child>:nth-child(4){animation-delay:.7s}
.av{animation:pop 1s .3s backwards}
.links a{transition:.25s}.links a:hover{transform:translateY(-4px);box-shadow:0 8px 24px #e6b12355}
.tl div{position:relative;opacity:0;transform:translateX(-16px);transition:opacity .7s var(--d,0s),transform .7s var(--d,0s)}
.rv.in .tl div{opacity:1;transform:none}.tl div:nth-child(2){--d:.2s}.tl div:nth-child(3){--d:.4s}.tl div:nth-child(4){--d:.6s}
.tl div:before{content:"";position:absolute;left:-23px;top:7px;width:9px;height:9px;border-radius:50%;background:#444;transition:.4s}
.tl div.act:before{background:var(--acc);box-shadow:0 0 14px var(--acc);transform:scale(1.4)}
#tech{overflow:hidden}
#tech .chip{translate:var(--x,0) var(--y,0);opacity:.45;transition:translate 1.3s cubic-bezier(.22,1,.36,1) var(--d,0s),opacity .9s var(--d,0s),transform .2s,border-color .2s}
#tech.in .chip{translate:0 0;opacity:1}
.pc{opacity:0;transform:translateY(34px);transition:opacity .7s var(--d,0s),transform .7s var(--d,0s),border-color .2s,box-shadow .3s}
#projects.in .pc{opacity:1;transform:none}#projects.in .pc:hover{transform:translateY(-6px);transition-delay:0s;box-shadow:0 14px 34px #e6b12344}
.pc .im{background-size:100% auto;transition:background-size .6s}.pc:hover .im{background-size:110% auto}
.btn{transition:.2s}.btn:hover{background:#fff;color:#000;border-color:#fff}.btn.g:hover{background:#16a34a;color:#fff}
.pc.x{display:none}.all .pc.x{display:block;animation:up .6s backwards}.pc.x.out{animation:out .35s forwards}
.more{padding:9px 22px;border-radius:7px;transition:.25s}.more:hover{background:var(--acc);color:var(--acctx);box-shadow:0 0 22px #e6b12366}
#modal{display:grid;opacity:0;visibility:hidden;transition:opacity .35s,visibility .35s}#modal.show{opacity:1;visibility:visible}
.mb{transform:translateY(24px) scale(.9);transition:transform .45s cubic-bezier(.2,.9,.3,1.15)}#modal.show .mb{transform:none}
.dots i{transition:.2s}.dots i:hover{filter:brightness(1.3);transform:scale(1.2)}
footer a{transition:.2s}footer a:hover{color:#000;transform:translateX(4px)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}#tech .chip{translate:0 0;opacity:1}.tl div,.pc{opacity:1;transform:none}}
</style></head><body>
<nav><div class="logo"><i style="background:#ef4444"></i><i style="background:#1d4ed8"></i><i style="background:#22c55e"></i> <span id="logo"></span></div>
<div class="navright"><div class="pill" id="pill"><span id="ind"></span><a href="#intro">Home</a><a href="#education">Education</a><a href="#tech">Tech Stack</a><a href="#projects">Projects</a><a href="#about">About</a></div><button id="themeBtn" aria-label="Toggle dark mode">🌙</button></div></nav>
<main id="app"></main><footer id="foot"></footer>
<div id="modal"><div class="mb" id="mb"></div></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const root=document.documentElement;
try{if(localStorage.getItem("pfolio-theme")==="dark")root.dataset.theme="dark"}catch(e){}
function syncTheme(){$("#themeBtn").textContent=root.dataset.theme==="dark"?"☀️":"🌙"}
syncTheme();
$("#themeBtn").onclick=()=>{root.dataset.theme=root.dataset.theme==="dark"?"light":"dark";try{localStorage.setItem("pfolio-theme",root.dataset.theme)}catch(e){}syncTheme()};
fetch("content.json?"+Date.now()).then(r=>r.json()).then(c=>render(c));
function render(c){
const s=c.site,P=c.projects||[];document.title=s.name+" | Portfolio";
const name=s.name.length>1?`${esc(s.name.slice(0,-3))}<b>${esc(s.name.slice(-3))}</b>`:esc(s.name);$("#logo").innerHTML=name;
const im=u=>u?`background-image:url('${esc(u)}')`:"";
const chips=a=>(a||[]).map(t=>`<span class="chip">${esc(t)}</span>`).join("");
const extBtn=(u,l,c,s)=>u&&u!=="#"?`<a class="btn${c?" "+c:""}" href="${esc(u)}" target="_blank"${s?' onclick="event.stopPropagation()"':""}>${l}</a>`:"";
$("#app").innerHTML=`
<section id="intro" class="hero rv"><div><h1>${esc(s.hello)}</h1><p>${esc(s.intro)}</p>
<div class="links">${s.email?`<a href="mailto:${esc(s.email)}"><b>Email</b>${esc(s.email)}</a>`:""}${s.linkedin?`<a href="https://linkedin.com/${esc(s.linkedin)}" target="_blank"><b>LinkedIn</b>${esc(s.linkedin)}</a>`:""}${s.github?`<a href="https://github.com/${esc(s.github)}" target="_blank"><b>Github</b>${esc(s.github)}</a>`:""}</div>
<div class="type" id="type"></div></div>
<div class="av">${s.avatar?`<img src="${esc(s.avatar)}" alt="">`:esc(s.name[0]||"?")}</div></section>
<section id="education" class="two rv"><div><h2><span><i class="fi fi-br-graduation-cap"></i></span>Education</h2><div class="tl">${(c.education||[]).map(e=>`<div><b>${esc(e.school)}</b><small>${esc(e.degree)}</small><small>${esc(e.years)}</small></div>`).join("")}</div></div>
<div><h2><span><i class="fi fi-br-briefcase"></i></span>Experience</h2><div class="tl">${(c.experience||[]).map(e=>`<div><b>${esc(e.role)}</b><small>${esc(e.place)}</small><small>${esc(e.years)}</small></div>`).join("")}</div></div></section>
<section id="tech"><h2><span style="color:var(--red)"><i class="fi fi-br-layers"></i></span>Tech Stack</h2>${(c.techstack||[]).map(g=>`<div class="grp"><h4>${esc(g.group)}</h4>${chips(g.items)}</div>`).join("")}</section>
<section id="projects" class="rv"><h2><span><i class="fi fi-br-code-simple"></i></span>Projects</h2><div class="grid" id="pg"></div><button class="more" id="more"></button></section>
<section id="about" class="rv"><h2><span><i class="fi fi-br-user"></i></span>About me</h2><div class="card"><h3>${esc(c.about.title)}</h3><p>${esc(c.about.text)}</p></div><div class="card"><h3>Hobbies</h3>${chips(c.about.hobbies)}</div></section>`;
$("#foot").innerHTML=`<div><div class="logo" style="color:var(--tx)">${name}</div><p style="margin-top:10px">${esc(c.footer.tagline)}</p></div><div><h4>Quick Links</h4><a href="#intro">Home</a><a href="#education">Education</a><a href="#tech">Tech Stack</a><a href="#projects">Projects</a></div><div><h4>Let's Connect</h4>${s.email?`<a href="mailto:${esc(s.email)}">Email</a>`:""}${s.github?`<a href="https://github.com/${esc(s.github)}" target="_blank">GitHub</a>`:""}${s.linkedin?`<a href="https://linkedin.com/${esc(s.linkedin)}" target="_blank">LinkedIn</a>`:""}<p style="margin-top:20px">© ${new Date().getFullYear()} ${esc(s.name)}. All rights reserved.</p></div>`;
// projects + show more/less
let all=false;$("#pg").innerHTML=P.map((p,i)=>`<div class="pc${i>3?" x":""}" data-i="${i}" style="--d:${(i%4)*.12}s"><div class="im" style="${im(p.image)}"></div><div class="b"><h3>${esc(p.title)}</h3><button class="btn">View Details</button>${extBtn(p.demo,"Demo","",1)}${extBtn(p.code,"Code","",1)}</div></div>`).join("");
const mo=$("#more"),G=$("#pg");mo.style.display=P.length>4?"block":"none";mo.textContent="Show More";
mo.onclick=()=>{if(!all){all=true;G.classList.add("all");G.querySelectorAll(".x").forEach((e,i)=>e.style.animationDelay=i*.12+"s");mo.textContent="Show Less"}else{G.querySelectorAll(".x").forEach(e=>{e.style.animationDelay="0s";e.classList.add("out")});setTimeout(()=>{G.classList.remove("all");G.querySelectorAll(".x").forEach(e=>e.classList.remove("out"));all=false;mo.textContent="Show More";$("#projects").scrollIntoView({behavior:"smooth"})},350)}};
$("#pg").onclick=e=>{const el=e.target.closest(".pc");if(!el)return;const p=P[el.dataset.i];
$("#mb").innerHTML=`<div class="dots" style="display:flex;align-items:center"><span><i style="background:#ef4444" data-x></i><i style="background:#eab308" data-x></i><i style="background:#22c55e"></i></span><small style="flex:1;text-align:center;color:var(--mu);margin-right:40px">${esc(p.title)}</small></div><div class="mg"><div class="im" style="${im(p.image)}"></div><div><h3>About the Project</h3><p style="color:var(--mu);margin:8px 0 14px;font-size:13px">${esc(p.description)}</p><h4 style="font-size:13px">Core Technologies</h4><div style="margin-top:8px">${chips(p.tech)}</div></div></div><div style="margin-top:16px">${extBtn(p.demo,"Live Demo","g")}${extBtn(p.code,"Source Code")}</div>`;$("#modal").classList.add("show")};
$("#modal").onclick=e=>{if(e.target.id==="modal"||e.target.dataset.x!==undefined)$("#modal").classList.remove("show")};
// typing
let k=0;const t=s.typing||"";(function f(){$("#type").textContent=t.slice(0,k)+"▌";if(k<t.length){k++;setTimeout(f,90)}})();
// reveal + active nav
const io=new IntersectionObserver(es=>es.forEach(e=>e.isIntersecting&&e.target.classList.add("in")),{threshold:.1});document.querySelectorAll(".rv").forEach(e=>io.observe(e));
const links=[...document.querySelectorAll("#pill a")];const ind=$("#ind"),mv=a=>{ind.style.left=a.offsetLeft+"px";ind.style.width=a.offsetWidth+"px"};mv(links[0]);links[0].classList.add("on");addEventListener("resize",()=>mv(links.find(a=>a.classList.contains("on"))||links[0]));const so=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){const id="#"+e.target.id;links.forEach(a=>{const on=a.getAttribute("href")===id;a.classList.toggle("on",on);if(on)mv(a)})}}),{rootMargin:"-40% 0px -55% 0px"});
document.querySelectorAll("main section").forEach(e=>so.observe(e));
document.querySelectorAll("#tech .chip").forEach((c,i)=>{c.style.setProperty("--x",(Math.random()*480-240)+"px");c.style.setProperty("--y",(Math.random()*320-160)+"px");c.style.setProperty("--d",(i%14)*.05+"s")});
new IntersectionObserver(es=>es.forEach(e=>e.target.classList.toggle("in",e.intersectionRatio>=.3)),{threshold:[0,.3]}).observe($("#tech"));
const ao=new IntersectionObserver(es=>es.forEach(e=>e.target.classList.toggle("act",e.isIntersecting)),{rootMargin:"-35% 0px -35% 0px"});document.querySelectorAll(".tl div").forEach(e=>ao.observe(e));
addEventListener("scroll",()=>document.body.style.setProperty("--glow",Math.max(0,1-scrollY/(innerHeight*.9))),{passive:true});
addEventListener("keydown",e=>e.key==="Escape"&&$("#modal").classList.remove("show"));
}
addEventListener("message",e=>{if(e.data&&e.data.t==="pfolio-preview"&&e.data.c){try{render(e.data.c)}catch(_){}}});
if(window.location.hash.includes("invite_token")||window.location.hash.includes("recovery_token"))location.href="/admin/"+location.hash;
</script></body></html>
